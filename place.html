<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Путеводитель по Суздалю</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="place.css">

  <base target="_self">
</head>
<body>
  <!-- Стрелки навигации -->
  <div class="temple-nav-arrows" id="templeNavArrows">
    <button class="temple-nav-arrow temple-prev-arrow" id="templePrevArrow">
      <div class="arrow-icon arrow-prev"></div>
    </button>
    <button class="temple-nav-arrow temple-next-arrow" id="templeNextArrow">
      <div class="arrow-icon arrow-next"></div>
    </button>
  </div>
  
  <div class="container mode-intro" id="frame">

       <div class="stories-progress-container" id="storiesProgress"></div>
    
    <a href="categories.html" class="back-button" id="backBtn">
      <div class="back-icon"></div>
    </a>

    <!-- Кнопка "открыть маршрут в яндекс картах" (видна только в режиме маршрута) -->
    <a href="#" class="yandex-maps-btn" id="yandexMapsBtn" target="_blank" rel="noopener noreferrer" style="display: none;">
      <span class="yandex-maps-text">открыть маршрут в<br>яндекс картах</span>
      <div class="yandex-maps-icon"></div>
    </a>

    <div class="video-background" id="videoPoster"></div>
    
    <!-- ⚠️ ПУСТОЙ SRC, заполняется скриптом -->
    <video class="temple-video" id="bgVideo" muted playsinline webkit-playsinline preload="auto" autoplay></video>
    
    <div class="overlay-gradient"></div>

    <div class="screen">
      <div class="scroll-zone" id="scrollZone">
        <div class="top-spacer"></div>

        <div class="title-block" id="titleBlock">
          <h1></h1>
          <div class="entry-note">
            <span></span>
            <div class="small-btn" id="paidBtn">
              <div class="open-icon"></div>
            </div>
          </div>
        </div>

        <div class="hero-details" id="heroDetails">
          <div class="details-header">подробнее:</div>
          <div class="photo-wrapper"></div>
        </div>

        <div id="dropdownsContainer"></div>
      </div>
    </div>

    <div class="bottom-shadow"></div>

    <!-- Финальный экран маршрута (скрыт по умолчанию) -->
    <div class="route-complete-screen" id="routeCompleteScreen" style="display: none;">
      <div class="route-complete-bg"></div>
      <button class="back-button" id="routeCompleteBackBtn" type="button">
        <div class="back-icon"></div>
      </button>
      <div class="route-complete-content">
        <h1 class="route-complete-title">МАРШРУТ<br>«ТАЙНЫ ГОРОДА»</h1>
        <a href="#" class="route-complete-btn route-complete-map-btn" id="routeCompleteMapBtn">
          <span class="route-complete-btn-text">ОТКРЫТЬ В<br>ЯНДЕКС КАРТАХ</span>
        </a>
        <a href="plan_walk.html" class="route-complete-btn route-complete-places-btn" id="routeCompletePlacesBtn">
          <span class="route-complete-btn-text">смотреть<br>больше мест</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Блок с предупреждением о перевороте устройства -->
  <div class="rotate-overlay">
    <span class="rotate-text">Переверните устройство</span>
    <div class="rotate-icon">
      <!-- Подключение вашей пиктограммы -->
      <img src="ui/turn.svg" alt="Переверните устройство">
    </div>
  </div>
  
  <!-- Скрипты функционала -->
     <script src="js/categories/museum_places.js"></script>
  <script src="js/categories/religious_places.js"></script>
   <script src="js/categories/nature_places.js"></script>
  <script src="js/categories/entertainment_places.js"></script>
  <script src="js/core/categories_config.js"></script>
  <script src="js/core/pages_manager.js"></script>
  <script src="js/core/spa_router.js"></script>
  <script src="js/core/place_menu.js"></script>

  <!-- ИНТЕГРИРОВАННЫЙ СКРИПТ VISUAL VIEWPORT -->
  <script>
      (function() {
          const isMobile = window.matchMedia('(max-width: 1080px)').matches || 
                           /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
          
          if (!isMobile) return;
          
          document.body.classList.add('is-mobile');
          
          const container = document.querySelector('.container');
          const vv = window.visualViewport;
          
          if (!vv || !container) return;
          
          function updateViewport() {
              // Обрезаем контейнер ровно по границе видимой области (без панелей инструментов)
              container.style.height = vv.height + 'px';
          }
          
          vv.addEventListener('resize', updateViewport);
          window.addEventListener('orientationchange', () => {
              setTimeout(updateViewport, 100);
          });
          
          updateViewport();
          window.addEventListener('load', updateViewport);
      })();
  </script>
<script>
    (function() {
        const frame = document.getElementById('frame');
        
        // Функция проверки размеров
        function checkScreenHeight() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            // Условие: Ширина > 1080 И Высота < 1060
            if (width > 1080 && height < 1060) {
                // Добавляем класс, если условия совпали
                frame.classList.add('short-screen');
            } else {
                // Убираем класс, если условия не совпадали (вернулись к обычному виду)
                frame.classList.remove('short-screen');
            }
        }

        // Запускаем проверку при загрузке страницы
        checkScreenHeight();

        // Запускаем проверку при изменении размера окна
        window.addEventListener('resize', checkScreenHeight);
    })();
</script>
</body>
</html>
